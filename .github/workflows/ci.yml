name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Make scripts executable
        run: chmod +x serverinit.sh tests/test_serverinit.sh tests/integration_test.sh

      - name: ShellCheck — serverinit.sh
        run: shellcheck -S warning serverinit.sh

      - name: ShellCheck — test suite
        run: shellcheck -S warning tests/test_serverinit.sh

      - name: ShellCheck — integration tests
        run: shellcheck -S warning tests/integration_test.sh

      - name: Run unit test suite
        run: bash tests/test_serverinit.sh ./serverinit.sh

  integration:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: test
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Docker + Basic Security (no nginx)"
            stack: 1
            sec: 1
            nginx: 0
          - name: "Base only + Basic Security"
            stack: 4
            sec: 1
            nginx: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run integration test - ${{ matrix.config.name }}
        run: |
          CONTAINER_NAME="serverinit-ci-test-$$"
          docker run -d --name "$CONTAINER_NAME" --privileged ubuntu:22.04 sleep 3600
          docker cp serverinit.sh "$CONTAINER_NAME:/tmp/serverinit.sh"

          # Run installation
          docker exec "$CONTAINER_NAME" bash -c "
            export DEBIAN_FRONTEND=noninteractive
            SI_STACK=${{ matrix.config.stack }} SI_SEC=${{ matrix.config.sec }} SI_NGINX=${{ matrix.config.nginx }} \
            bash /tmp/serverinit.sh --ci
          " && echo "✔ Installation completed" || {
            echo "Installation failed, showing last 50 lines of log:"
            docker exec "$CONTAINER_NAME" bash -c "tail -50 /root/serverinit_*.log 2>/dev/null || echo 'No log found'"
            exit 1
          }

          # Basic verification based on stack
          if [ ${{ matrix.config.stack }} -eq 1 ]; then
            docker exec "$CONTAINER_NAME" which docker && echo "✔ Docker installed" || exit 1
            docker exec "$CONTAINER_NAME" docker compose version && echo "✔ Docker Compose plugin working" || exit 1
          fi

          if [ ${{ matrix.config.nginx }} -eq 1 ]; then
            docker exec "$CONTAINER_NAME" which nginx && echo "✔ Nginx installed" || exit 1
          fi

          docker exec "$CONTAINER_NAME" bash -c "ufw status | grep -q 'Status: active'" && echo "✔ UFW active" || exit 1

          # Cleanup
          docker rm -f "$CONTAINER_NAME"

  dry-run-ci-mode:
    name: CI mode dry-run (syntax only)
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify --ci flag is parsed correctly
        run: |
          # Confirm the script parses CI env vars without executing anything
          grep -q 'CI_MODE=1' serverinit.sh       && echo "✔ CI_MODE flag found"
          grep -q 'SI_STACK'  serverinit.sh        && echo "✔ SI_STACK env var found"
          grep -q 'SI_SEC'    serverinit.sh        && echo "✔ SI_SEC env var found"
          grep -q 'SI_SSH_PORT' serverinit.sh      && echo "✔ SI_SSH_PORT env var found"
          grep -q 'SI_NGINX'    serverinit.sh      && echo "✔ SI_NGINX env var found"
          grep -q 'MIN_FREE_AFTER_SWAP' serverinit.sh && echo "✔ Disk limiter found"

      - name: Bash syntax check
        run: bash -n serverinit.sh && echo "✔ No syntax errors"
